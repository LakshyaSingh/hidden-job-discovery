name: Aggregate feeds

# Pulls the broad job feeds (The Muse, Remotive, Jobicy, Adzuna) into the
# database. This used to be a step inside the weekly discover workflow, which
# meant feed jobs were at best a week stale and, whenever discover failed, went
# stale indefinitely. They are the widest sources in the system, so they get
# their own daily run.
on:
  schedule:
    - cron: "40 5 * * *" # daily, 05:40 UTC
  workflow_dispatch: {}

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      AUTO_CREATE_TABLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Aggregate broad US feeds
        run: python -m app.worker.run aggregate
