name: Discover companies

# Probes candidate ATS boards, registers live ones, then crawls so the new
# companies populate immediately. Weekly (boards change slowly) + manual.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      BRAVE_SEARCH_MAX_QUERIES: "30"
      AUTO_CREATE_TABLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Brave ATS token discovery
        run: python -m app.worker.run discover-search
      - name: Discover companies
        run: python -m app.worker.run discover
      # Feed aggregation moved to its own daily workflow (aggregate.yml);
      # tying it to a weekly job left the widest sources permanently stale.
      - name: Crawl (populate newly-added companies)
        run: python -m app.worker.run crawl
