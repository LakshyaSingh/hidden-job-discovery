name: Crawl jobs

# Runs the crawler on a schedule (free) and writes to the Render database.
# Requires a repo secret DATABASE_URL = your Render EXTERNAL database URL.
on:
  schedule:
    # Eight runs/day. The old four were a budget decision, not a product one:
    # the 2,000 monthly minutes that come with a private repo could not cover
    # more. This repo is public, where standard runners are unmetered, so the
    # only real limits now are politeness to the ATS APIs (already handled by
    # the per-host throttle in scrapers/http.py) and write load on a free
    # Postgres. Worth tightening further once a real run confirms how long a
    # sweep actually takes.
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}       # allows manual runs from the Actions tab

concurrency:
  group: crawl
  cancel-in-progress: false   # never interrupt an in-flight crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTO_CREATE_TABLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Seed sample companies (idempotent)
        run: python -m app.worker.run seed
      - name: Crawl
        run: python -m app.worker.run crawl
