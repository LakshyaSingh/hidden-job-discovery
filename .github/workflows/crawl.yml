name: Crawl jobs

# Runs the crawler on a schedule (free) and writes to the Render database.
# Requires a repo secret DATABASE_URL = your Render EXTERNAL database URL.
on:
  schedule:
    # Hourly. A sweep took 76 minutes while the crawler was still dispatching
    # companies that have no scraper; measured at 6m15s afterwards, so an
    # hourly cron costs ~150 unmetered minutes a day on a public repo and
    # cannot overlap itself. Politeness to the ATS APIs comes from the
    # per-host throttle in scrapers/http.py, not from the schedule.
    - cron: "17 * * * *"   # hourly
  workflow_dispatch: {}       # allows manual runs from the Actions tab

concurrency:
  group: crawl
  cancel-in-progress: false   # never interrupt an in-flight crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTO_CREATE_TABLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Seed sample companies (idempotent)
        run: python -m app.worker.run seed
      - name: Crawl
        run: python -m app.worker.run crawl
