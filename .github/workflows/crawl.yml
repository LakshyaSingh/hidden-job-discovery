name: Crawl jobs

# Runs the crawler on a schedule (free) and writes to the Render database.
# Requires a repo secret DATABASE_URL = your Render EXTERNAL database URL.
on:
  schedule:
    # Every six hours. Runner minutes are unmetered on a public repo, so the
    # binding constraint is not compute but the database's egress allowance:
    # a sweep re-reads every posting it already holds, and at ~54,000 postings
    # even the narrow columns ingest now selects come to a few MB per sweep.
    # Hourly worked out at roughly 4 GB a month against a 5 GB allowance,
    # which is not enough margin to also serve the site. Raise this only
    # against a measured egress figure, not an estimate: guessing wrong costs
    # a month of downtime, because exceeding the quota blocks the database
    # outright rather than throttling it.
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # allows manual runs from the Actions tab

concurrency:
  group: crawl
  cancel-in-progress: false   # never interrupt an in-flight crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTO_CREATE_TABLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Seed sample companies (idempotent)
        run: python -m app.worker.run seed
      - name: Crawl
        run: python -m app.worker.run crawl
