name: Keep API warm

# Pings the free Render API so it doesn't sleep (and cold-start ~30s) between
# visits. GitHub's scheduler can be delayed, so this reduces cold starts rather
# than eliminating them; for zero cold starts, use an always-on paid instance or
# a dedicated uptime pinger (UptimeRobot/cron-job.org) at a 5-minute interval.
#
# Removed in d1d7ed0 to save Actions minutes on a private repo. The repo is
# public now, where standard runners are unmetered, so that reason is gone.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# A delayed scheduler can release several ticks at once; there is no point
# queueing pings behind each other.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -fsS -m 60 https://jobscraper-api-gxqz.onrender.com/health || true
