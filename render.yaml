# Render Blueprint: provisions the FastAPI web service only.
# On Render: New -> Blueprint -> connect this repo. Render reads this file.
#
# The database is deliberately NOT provisioned here. Render's free Postgres is
# deleted 30 days after it is created, and that is a countdown from creation,
# not an inactivity timeout: the crawler was writing to it hourly and it expired
# regardless, taking every job and all 326 discovered company boards with it.
# Nothing in this application is Render-specific, so the database lives with a
# provider whose free tier does not expire, and DATABASE_URL is set by hand in
# the dashboard.
#
# Free-tier notes:
#   * The free web service sleeps after ~15 min idle and cold-starts on request.
#     .github/workflows/keep-warm.yml mitigates this.
#   * Migrations run at container start, since the paid-only preDeployCommand is
#     unavailable here. Note the consequence: if migrations cannot reach the
#     database, gunicorn never starts and the API is down rather than degraded.
#
# The crawler does NOT run here. It runs for free via GitHub Actions
# (.github/workflows/crawl.yml), which connects to the same database directly.

services:
  - type: web
    name: jobscraper-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Set in the Render dashboard. asyncpg ignores libpq's sslmode parameter,
      # so a managed URL carrying ?sslmode=require is rewritten in app/config.py.
      - key: DATABASE_URL
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Set to your Vercel URL after the frontend deploys (e.g.
      # https://your-app.vercel.app). Left unset here on purpose.
      - key: CORS_ORIGINS
        sync: false
      # Guards /crawl and POST /companies. Render generates a strong value;
      # read it from the dashboard to use the "Run crawl" button or add companies.
      - key: ADMIN_API_KEY
        generateValue: true
